name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
        cache-dependency-path: './app/pnpm-lock.yaml'
        
    - name: Install dependencies
      working-directory: ./app
      run: pnpm install
      
    - name: Lint (ESLint)
      working-directory: ./app
      run: pnpm run lint
      
    - name: Lint CSS (Stylelint)
      working-directory: ./app
      run: pnpm run lint:css
      
    - name: Type Check
      working-directory: ./app
      run: pnpm tsc -b
      
    - name: UI Compliance Check
      working-directory: ./app
      run: pnpm run ui-check
      
    - name: Run Tests
      working-directory: ./app
      run: pnpm run test:run
      
    - name: Build
      working-directory: ./app
      run: pnpm run build
